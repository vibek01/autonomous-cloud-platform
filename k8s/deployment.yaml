apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-api-deployment
  labels:
    app: autonomous-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous-api
  template:
    metadata:
      labels:
        app: autonomous-api
    spec:
      containers:
      - name: api
        image: autonomous-api:latest
        imagePullPolicy: Never  # Use the local image we build in minikube
        ports:
        - containerPort: 8000
        # STRICT RESOURCE LIMITS: Protects your Mac from the app consuming too much memory/CPU
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "150Mi"
            cpu: "200m"
        # Kubernetes will use this to check if the pod is ready to receive traffic
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 1
        # Kubernetes will use this to check if the pod is alive
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-api-service
spec:
  type: NodePort
  selector:
    app: autonomous-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
