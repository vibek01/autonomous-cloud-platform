apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-controller
  labels:
    app: autonomous-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous-controller
  template:
    metadata:
      labels:
        app: autonomous-controller
    spec:
      serviceAccountName: controller-sa
      containers:
      - name: controller
        image: autonomous-controller:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TARGET_DEPLOYMENT
          value: "autonomous-api-deployment"
        - name: TARGET_SERVICE
          value: "autonomous-api-service"
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-controller-service
spec:
  type: NodePort
  selector:
    app: autonomous-controller
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
